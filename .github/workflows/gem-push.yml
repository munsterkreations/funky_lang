name: Ruby Gem

on:
  push:
    branches: [ "My-Web-Sites" ]
  pull_request:
    branches: [ "My-Web-Sites" ]

jobs:
  build:
    name: Build + Publish
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby 
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.0.0

    - name: Setup Ruby environment with ruby-build
  # You may pin to the exact commit or the version.
  # uses: clupprich/ruby-build-action@d2971553edbe27a9cb7e277f22b549114bfd3ccf
      uses: clupprich/ruby-build-action@v1.3.0
      with:
       # Ruby version
        ruby-version:  default is 2.6.5
       # Flag if the Ruby installation is cached
        cache-available:  default is false
          

    - name: Publish to RubyGems
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem build *.gemspec
        gem push *.gem
      env:
        GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_AUTH_TOKEN}}"
      continue-on-error: true
